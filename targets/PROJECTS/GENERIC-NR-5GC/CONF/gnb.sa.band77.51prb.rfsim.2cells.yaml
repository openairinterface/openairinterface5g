# SPDX-License-Identifier: LicenseRef-CSSL-1.0
#
# Sample 2-cell monolithic gNB config for RFsimulator.
# Each cell is a separate gNBs[] entry with the same gNB_ID and gNB_name.
# AMF/SCTP/NETWORK_INTERFACES/TIMERS are only read from the first entry.
#
# Cell 0: band 77, 51 PRBs, SSB 4008 MHz (pointA ~4000 MHz), PCI 0, nr_cellid 12345678
# Cell 1: band 77, 51 PRBs, SSB 4160.64 MHz (pointA ~4152.72 MHz), PCI 1, nr_cellid 11111111

Active_gNBs:
  - gNB-OAI
Asn1_verbosity: none

gNBs:
    # Cell 0 — also holds AMF/SCTP/NETWORK_INTERFACES/TIMERS (gNB-wide, only read from gNBs[0])
    - gNB_ID: "0xe00"
      gNB_name: gNB-OAI
      maxMIMO_layers: 1
      tracking_area_code: 1
      plmn_list:
        - mcc: "001"
          mnc: "01"
          mnc_length: 2
          snssaiList:
            - sst: "1"
              sd: "0xFFFFFF"
      nr_cellid: "12345678"
      pdsch_AntennaPorts_XP: 1
      pdsch_AntennaPorts_N1: 1
      pdsch_AntennaPorts_N2: 1
      pusch_AntennaPorts: 1
      CSI_report_type: "ssb_rsrp"
      do_CSIRS: 1
      do_SRS: "none"
      min_rxtxtime: 4
      uess_agg_levels: [0, 4, 2, 1, 0]
      ul_prbblacklist: ""
      um_on_default_drb: 0
      disable_harq: 0
      servingCellConfigCommon:
        - physCellId: 0
          absoluteFrequencySSB: 667200
          dl_frequencyBand: 77
          dl_absoluteFrequencyPointA: 666672
          dl_offstToCarrier: 0
          dl_subcarrierSpacing: 1
          dl_carrierBandwidth: 51
          initialDLBWPlocationAndBandwidth: 13750
          initialDLBWPsubcarrierSpacing: 1
          initialDLBWPcontrolResourceSetZero: 10
          initialDLBWPsearchSpaceZero: 0
          ul_frequencyBand: 77
          ul_absoluteFrequencyPointA: 666672
          ul_offstToCarrier: 0
          ul_subcarrierSpacing: 1
          ul_carrierBandwidth: 51
          pMax: 24
          initialULBWPlocationAndBandwidth: 13750
          initialULBWPsubcarrierSpacing: 1
          prach_ConfigurationIndex: 148
          prach_msg1_FDM: 0
          prach_msg1_FrequencyStart: 0
          zeroCorrelationZoneConfig: 0
          preambleReceivedTargetPower: -90
          preambleTransMax: 6
          powerRampingStep: 1
          ra_ResponseWindow: 5
          ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
          ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 15
          ra_ContentionResolutionTimer: 7
          rsrp_ThresholdSSB: 19
          prach_RootSequenceIndex_PR: 2
          prach_RootSequenceIndex: 1
          msg1_SubcarrierSpacing: 1
          restrictedSetConfig: 0
          msg3_DeltaPreamble: 1
          p0_NominalWithGrant: -90
          pucchGroupHopping: 0
          hoppingId: 40
          p0_nominal: -90
          n_TimingAdvanceOffset: -1
          dmrs_TypeA_Position: 0
          subcarrierSpacing: 1
          ssb_PositionsInBurst_Bitmap: 1
          ssb_periodicityServingCell: 2
          referenceSubcarrierSpacing: 1
          dl_UL_TransmissionPeriodicity: 5
          nrofDownlinkSlots: 3
          nrofDownlinkSymbols: 6
          nrofUplinkSlots: 1
          nrofUplinkSymbols: 4
          ssPBCH_BlockPower: -20
      SCTP:
        SCTP_INSTREAMS: 2
        SCTP_OUTSTREAMS: 2
      amf_ip_address:
        - ipv4: 127.0.0.1
      NETWORK_INTERFACES:
        GNB_IPV4_ADDRESS_FOR_NG_AMF: 127.0.0.1
        GNB_IPV4_ADDRESS_FOR_NGU: 127.0.0.1
        GNB_PORT_FOR_S1U: "2152"
      TIMERS:
        t300: 400
        t301: 400
        t310: 2000
        t311: 3000
        n310: 20
        n311: 1
        t319: 400
    # Cell 1 — per-cell params only; AMF/SCTP/NETWORK_INTERFACES/TIMERS are not read from this entry
    - gNB_ID: "0xe00"
      gNB_name: gNB-OAI
      maxMIMO_layers: 1
      tracking_area_code: 2
      plmn_list:
        - mcc: "001"
          mnc: "01"
          mnc_length: 2
          snssaiList:
            - sst: "1"
              sd: "0xFFFFFF"
      nr_cellid: "11111111"
      pdsch_AntennaPorts_XP: 1
      pdsch_AntennaPorts_N1: 1
      pdsch_AntennaPorts_N2: 1
      pusch_AntennaPorts: 1
      CSI_report_type: "ssb_rsrp"
      do_CSIRS: 1
      do_SRS: "none"
      min_rxtxtime: 4
      uess_agg_levels: [0, 4, 2, 1, 0]
      ul_prbblacklist: ""
      um_on_default_drb: 0
      disable_harq: 0
      servingCellConfigCommon:
        - physCellId: 1
          absoluteFrequencySSB: 677376
          dl_frequencyBand: 77
          dl_absoluteFrequencyPointA: 676848
          dl_offstToCarrier: 0
          dl_subcarrierSpacing: 1
          dl_carrierBandwidth: 51
          initialDLBWPlocationAndBandwidth: 13750
          initialDLBWPsubcarrierSpacing: 1
          initialDLBWPcontrolResourceSetZero: 10
          initialDLBWPsearchSpaceZero: 0
          ul_frequencyBand: 77
          ul_absoluteFrequencyPointA: 676848
          ul_offstToCarrier: 0
          ul_subcarrierSpacing: 1
          ul_carrierBandwidth: 51
          pMax: 24
          initialULBWPlocationAndBandwidth: 13750
          initialULBWPsubcarrierSpacing: 1
          prach_ConfigurationIndex: 148
          prach_msg1_FDM: 0
          prach_msg1_FrequencyStart: 0
          zeroCorrelationZoneConfig: 0
          preambleReceivedTargetPower: -90
          preambleTransMax: 6
          powerRampingStep: 1
          ra_ResponseWindow: 5
          ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
          ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 15
          ra_ContentionResolutionTimer: 7
          rsrp_ThresholdSSB: 19
          prach_RootSequenceIndex_PR: 2
          prach_RootSequenceIndex: 2
          msg1_SubcarrierSpacing: 1
          restrictedSetConfig: 0
          msg3_DeltaPreamble: 1
          p0_NominalWithGrant: -90
          pucchGroupHopping: 0
          hoppingId: 41
          p0_nominal: -90
          n_TimingAdvanceOffset: -1
          dmrs_TypeA_Position: 0
          subcarrierSpacing: 1
          ssb_PositionsInBurst_Bitmap: 2
          ssb_periodicityServingCell: 2
          referenceSubcarrierSpacing: 1
          dl_UL_TransmissionPeriodicity: 5
          nrofDownlinkSlots: 3
          nrofDownlinkSymbols: 6
          nrofUplinkSlots: 1
          nrofUplinkSymbols: 4
          ssPBCH_BlockPower: -20
pdcp:
  drb:
    sn_size: "len18bits"
    t_reordering: "ms1000"
    discard_timer: "infinity"
rlc:
  srb:
    t_poll_retransmit: "ms45"
  drb_am:
    pollByte: "infinity"
    pollPDU: "p128"
    t_poll_retransmit: "ms100"
  drb_um:
    sn_field_length: "size12"
    t_reassembly: "ms15"
MACRLCs:
  - tr_s_preference: local_L1
    tr_n_preference: local_RRC
L1s:
  - num_cc: 1
    tr_n_preference: local_mac
    prach_dtx_threshold: 80
    pucch0_dtx_threshold: 10
    pusch_dtx_threshold: 10
    max_ldpc_iterations: 16
    L1_num_rx_sym_per_thread: 4
    L1_num_tx_sym_per_thread: 4
RUs:
  - local_rf: "yes"
    nb_tx: 2
    nb_rx: 2
    att_tx: 0
    att_rx: 0
    sl_ahead: 6
    bands:
      - 77
    max_pdschReferenceSignalPower: -27
    max_rxgain: 76
    if_freq: "0"
    eNB_instances:
      - 0
    clock_src: internal
    time_src: internal
    sdr_addrs: ""
rfsimulator:
  - serveraddr: server
    serverport: "4043"
    options: []
    prop_delay: 0.0
    modelname: AWGN
    IQfile: /tmp/rfsimulator.iqs
security:
  ciphering_algorithms:
    - nea0
    - nea2
    - nea1
  integrity_algorithms:
    - nia2
    - nia1
    - nia0
  drb_ciphering: "yes"
  drb_integrity: "no"
log_config:
  global_log_level: info
  hw_log_level: info
  phy_log_level: info
  mac_log_level: info
  rlc_log_level: info
  pdcp_log_level: info
  rrc_log_level: info
  ngap_log_level: info
  f1ap_log_level: info
  gtpu_log_level: info
