# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      referenceSubcarrierSpacing                                    = 1;
      # pattern1
      # dl_UL_TransmissionPeriodicity
      # 0=ms0p5, 1=ms0p625, 2=ms1, 3=ms1p25, 4=ms2, 5=ms2p5, 6=ms5, 7=ms10
      dl_UL_TransmissionPeriodicity                                 = 6;  #5;
      nrofDownlinkSlots                                             = 6;  #3;
      nrofDownlinkSymbols                                           = 10; #6;
      nrofUplinkSlots                                               = 3;  #1;
      nrofUplinkSymbols                                             = 0;

      ssPBCH_BlockPower                                             = -15;
  }

  );


    # ------- SCTP definitions
    SCTP :
    {
        # Number of streams to use in input/output
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };


    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "172.21.6.103"; });


    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "172.21.8.120";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "172.21.8.120";
        GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
    };

  }
);

MACRLCs = (
{
  remote_s_address   = "127.0.0.1"; // pnf addr [!]
  local_s_address    = "127.0.0.2"; // vnf addr
  local_s_portc      = 50001; // vnf p5 port
  local_s_portd      = 50011; // vnf p7 port [!]
  tr_s_preference    = "aerial";
  tr_n_preference    = "local_RRC";
  pucch_RSSI_Threshold = -270;
  pusch_RSSI_Threshold = -260;
  pusch_TargetSNRx10 = 280;
  pucch_TargetSNRx10 = 200;
  dl_max_mcs         = 28;
  ul_max_mcs         = 28;
}
);


security = {
  # preferred ciphering algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nea0, nea1, nea2, nea3
  ciphering_algorithms = ( "nea0" );

  # preferred integrity algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nia0, nia1, nia2, nia3
  integrity_algorithms = ( "nia2", "nia0" );

  # setting 'drb_ciphering' to "no" disables ciphering for DRBs, no matter
  # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level ="info";
  hw_log_level     ="info";
  phy_log_level    ="info";
  mac_log_level    ="info";
  rlc_log_level    ="info";
  pdcp_log_level   ="info";
  rrc_log_level    ="info";
  ngap_log_level   ="debug";
  f1ap_log_level   ="debug";
};
