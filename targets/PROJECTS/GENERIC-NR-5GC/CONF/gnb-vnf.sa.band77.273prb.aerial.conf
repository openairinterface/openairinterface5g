    uess_agg_levels       = [0, 4, 2, 1, 0];

    servingCellConfigCommon = (
    {
 #spCellConfigCommon

      physCellId                                                    = 0;

#  downlinkConfigCommon
    #frequencyInfoDL
      # center frequency = 3350.01 MHz
      # selected SSB frequency = 3349.92 MHz
      absoluteFrequencySSB                                          = 656640;
      dl_frequencyBand                                              = 77;
